[project]
name = "paladin"
version = "0.1.0"
description = "H&E WSI biomarker inference to predict treatment effects."
readme = "README.md"
license = "MIT"
keywords = ["python"]
authors = [
  {name = "Kevin Boehm", email = "boehmk@mskcc.org"},
]
requires-python = ">=3.11, <3.12"

# setuptools<81 is required: lightning 2.3 uses pkg_resources (removed in 81+)
dependencies = [
    "dotenv>=0.9.9",
    "fastparquet>=2024.11.0",
    "h5py>=3.14.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "lifelines>=0.30.3",
    "lightning==2.3.0",
    "matplotlib",
    # "nn-template-core==0.4.0",
    "numpy==1.26.4",
    "pandas",
    "pydantic>=2.1.1",
    "pydantic-core>=2.18",
    "scikit-learn",
    "scipy",
    "seaborn",
    "setuptools<81",
    "statsmodels",
    "torchmetrics==1.4.2",
    "wandb>=0.21.0",
]

[project.urls]
source = "https://github.com/pathology-data-mining/paladin"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]

[project.optional-dependencies]
"torch-cpu" = [ "torch==2.4.1", "torchvision==0.19.1" ]
"torch-gpu" = [ "torch==2.4.1", "torchvision==0.19.1" ]

[tool.uv]
conflicts = [
  [{ extra = "torch-cpu" }, { extra = "torch-gpu" }],
]

[tool.uv.sources]
torch = [
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
]
torchvision = [
  { index = "torch-cpu", extra = "torch-cpu" },
  { index = "torch-gpu", extra = "torch-gpu" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "pragma: nocover",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 120
include = '\.pyi?$'

[tool.mypy]
files= ["src/**/*.py", "test/*.py"]
ignore_missing_imports = true

[tool.isort]
profile = 'black'
line_length = 120
known_third_party = ["numpy", "pytest", "wandb", "torch"]
known_first_party = ["nn_core"]
known_local_folder = "paladin"

[tool.pydocstyle]
convention = 'google'
# ignore all missing docs errors
add-ignore = ['D100', 'D101', 'D102', 'D103', 'D104', 'D105', 'D106', 'D107']

[tool.bandit]
skips = ["B101"]

[tool.setuptools_scm]
write_to = "src/paladin/_version.py"
write_to_template = '__version__ = "{version}"'

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
